enabled: true

storage:
  data_dir: 'user/data/goosialize-google'
  database: 'google.sqlite'

authentication:
  default_connection: null
  service_account_file: ''


consent:
  consumer_enabled: true

analytics:
  enabled: true
  default_property: null

cache:
  enabled: true
  ttl: 900
  stale_on_error: true
  stale_max_age: 86400

diagnostics:
  enabled: true


tracking:
  enabled: false
  measurement_id: ''
  send_page_view: true
  allow_google_signals: false
  allow_ad_personalization_signals: false
  debug_mode: false
  cookie_domain: ''
  cookie_prefix: ''
  cookie_expires: 0
  linker_domains: []
  user_properties: {}
  event_parameters: {}

search_console:
  enabled: true
  default_property: null
