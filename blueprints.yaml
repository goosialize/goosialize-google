name: Goosialize Google — Tools & Integrations
slug: goosialize-google
type: plugin
version: 0.2.1
description: Google Analytics 4 and Google Search Console integrations for Grav CMS.
icon: google

author:
  name: Goosialize Ltd
  email: dev@goosialize.com

homepage: https://goosialize.com

keywords:
  - grav
  - google
  - analytics
  - ga4
  - search-console
  - reporting

bugs: https://github.com/goosialize/goosialize-google/issues
license: MIT

dependencies:
  - { name: grav, version: '>=2.0.0' }

form:
  validation: strict

  fields:
    enabled:
      type: toggle
      label: PLUGIN_GOOSIALIZE_GOOGLE.ENABLED
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    authentication_group:
      type: fieldset
      title: PLUGIN_GOOSIALIZE_GOOGLE.AUTHENTICATION
      text: PLUGIN_GOOSIALIZE_GOOGLE.AUTHENTICATION_HELP
      collapsible: true
      collapsed: true
      fields:

        authentication.default_connection:
          type: text
          label: PLUGIN_GOOSIALIZE_GOOGLE.DEFAULT_CONNECTION
          help: PLUGIN_GOOSIALIZE_GOOGLE.DEFAULT_CONNECTION_HELP

        authentication.service_account_file:
          type: text
          label: PLUGIN_GOOSIALIZE_GOOGLE.SERVICE_ACCOUNT_FILE
          help: PLUGIN_GOOSIALIZE_GOOGLE.SERVICE_ACCOUNT_FILE_HELP

    analytics_group:
      type: fieldset
      title: PLUGIN_GOOSIALIZE_GOOGLE.ANALYTICS
      text: PLUGIN_GOOSIALIZE_GOOGLE.ANALYTICS_HELP
      collapsible: true
      collapsed: true
      fields:

        analytics.enabled:
          type: toggle
          label: PLUGIN_GOOSIALIZE_GOOGLE.ANALYTICS_ENABLED
          help: PLUGIN_GOOSIALIZE_GOOGLE.ANALYTICS_ENABLED_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        analytics.default_property:
          type: text
          label: PLUGIN_GOOSIALIZE_GOOGLE.DEFAULT_PROPERTY
          help: PLUGIN_GOOSIALIZE_GOOGLE.DEFAULT_PROPERTY_HELP
          validate:
            pattern: '^[0-9]+$'

    consent_group:
      type: fieldset
      title: PLUGIN_GOOSIALIZE_GOOGLE.CONSENT
      text: PLUGIN_GOOSIALIZE_GOOGLE.CONSENT_HELP
      collapsible: true
      collapsed: true
      fields:

        consent.consumer_enabled:
          type: toggle
          label: PLUGIN_GOOSIALIZE_GOOGLE.CONSENT_CONSUMER_ENABLED
          help: PLUGIN_GOOSIALIZE_GOOGLE.CONSENT_CONSUMER_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

    tracking_group:
      type: fieldset
      title: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING
      text: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_HELP
      collapsible: true
      collapsed: true
      fields:

        tracking.enabled:
          type: toggle
          label: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_ENABLED
          help: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_ENABLED_HELP
          highlight: 1
          default: 0
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        tracking.measurement_id:
          type: text
          label: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_MEASUREMENT_ID
          help: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_MEASUREMENT_ID_HELP
          placeholder: G-XXXXXXXXXX
          validate:
            pattern: '^(G-[A-Za-z0-9]+)?$'

        tracking.advanced:
          type: fieldset
          title: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_ADVANCED
          text: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_ADVANCED_HELP
          collapsible: true
          collapsed: true
          fields:

            tracking.send_page_view:
              type: toggle
              label: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_SEND_PAGE_VIEW
              help: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_SEND_PAGE_VIEW_HELP
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool

            tracking.allow_google_signals:
              type: toggle
              label: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_GOOGLE_SIGNALS
              help: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_GOOGLE_SIGNALS_HELP
              highlight: 0
              default: 0
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool

            tracking.allow_ad_personalization_signals:
              type: toggle
              label: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_AD_PERSONALIZATION
              help: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_AD_PERSONALIZATION_HELP
              highlight: 0
              default: 0
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool

            tracking.debug_mode:
              type: toggle
              label: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_DEBUG_MODE
              help: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_DEBUG_MODE_HELP
              highlight: 0
              default: 0
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool

            tracking.cookie_domain:
              type: text
              label: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_COOKIE_DOMAIN
              help: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_COOKIE_DOMAIN_HELP
              placeholder: Google default

            tracking.cookie_prefix:
              type: text
              label: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_COOKIE_PREFIX
              help: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_COOKIE_PREFIX_HELP
              validate:
                pattern: '^[A-Za-z0-9_-]*$'

            tracking.cookie_expires:
              type: number
              label: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_COOKIE_EXPIRES
              help: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_COOKIE_EXPIRES_HELP
              default: 0
              min: 0
              validate:
                type: int
                min: 0

            tracking.linker_domains:
              type: array
              value_only: true
              label: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_LINKER_DOMAINS
              help: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_LINKER_DOMAINS_HELP
              placeholder_value: example.com

            tracking.user_properties:
              type: array
              label: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_USER_PROPERTIES
              help: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_USER_PROPERTIES_HELP
              placeholder_key: customer_type
              placeholder_value: registered

            tracking.event_parameters:
              type: array
              label: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_EVENT_PARAMETERS
              help: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_EVENT_PARAMETERS_HELP
              placeholder_key: site_section
              placeholder_value: main

    search_console_group:
      type: fieldset
      title: PLUGIN_GOOSIALIZE_GOOGLE.SEARCH_CONSOLE
      text: PLUGIN_GOOSIALIZE_GOOGLE.SEARCH_CONSOLE_HELP
      collapsible: true
      collapsed: true
      fields:

        search_console.enabled:
          type: toggle
          label: PLUGIN_GOOSIALIZE_GOOGLE.SEARCH_CONSOLE_ENABLED
          help: PLUGIN_GOOSIALIZE_GOOGLE.SEARCH_CONSOLE_ENABLED_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_ADMIN.ENABLED
            0: PLUGIN_ADMIN.DISABLED
          validate:
            type: bool

        search_console.default_property:
          type: text
          label: PLUGIN_GOOSIALIZE_GOOGLE.SEARCH_CONSOLE_DEFAULT_PROPERTY
          help: PLUGIN_GOOSIALIZE_GOOGLE.SEARCH_CONSOLE_DEFAULT_PROPERTY_HELP
