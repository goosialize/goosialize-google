name: Goosialize Google — Tools & Integrations
slug: goosialize-google
type: plugin
version: 0.2.1
description: Google Analytics 4 and Google Search Console integrations for Grav CMS.
icon: google

author:
  name: Goosialize Ltd
  email: dev@goosialize.com

homepage: https://goosialize.com

keywords:
  - grav
  - google
  - analytics
  - ga4
  - search-console
  - reporting

bugs: https://github.com/goosialize/goosialize-google/issues
license: MIT

dependencies:
  - { name: grav, version: '>=2.0.0' }

form:
  validation: strict

  fields:
    enabled:
      type: toggle
      label: PLUGIN_GOOSIALIZE_GOOGLE.ENABLED
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    authentication:
      type: section
      title: PLUGIN_GOOSIALIZE_GOOGLE.AUTHENTICATION
      underline: true

    authentication.default_connection:
      type: text
      label: PLUGIN_GOOSIALIZE_GOOGLE.DEFAULT_CONNECTION
      help: PLUGIN_GOOSIALIZE_GOOGLE.DEFAULT_CONNECTION_HELP

    authentication.service_account_file:
      type: text
      label: PLUGIN_GOOSIALIZE_GOOGLE.SERVICE_ACCOUNT_FILE
      help: PLUGIN_GOOSIALIZE_GOOGLE.SERVICE_ACCOUNT_FILE_HELP

    analytics:
      type: section
      title: PLUGIN_GOOSIALIZE_GOOGLE.ANALYTICS
      underline: true

    analytics.enabled:
      type: toggle
      label: PLUGIN_GOOSIALIZE_GOOGLE.ANALYTICS_ENABLED
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    analytics.default_property:
      type: text
      label: PLUGIN_GOOSIALIZE_GOOGLE.DEFAULT_PROPERTY
      help: PLUGIN_GOOSIALIZE_GOOGLE.DEFAULT_PROPERTY_HELP
      validate:
        pattern: '^[0-9]+$'

    consent:
      type: section
      title: PLUGIN_GOOSIALIZE_GOOGLE.CONSENT
      underline: true

    consent.consumer_enabled:
      type: toggle
      label: PLUGIN_GOOSIALIZE_GOOGLE.CONSENT_CONSUMER_ENABLED
      help: PLUGIN_GOOSIALIZE_GOOGLE.CONSENT_CONSUMER_HELP
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    tracking:
      type: section
      title: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING
      underline: true

    tracking.enabled:
      type: toggle
      label: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_ENABLED
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    tracking.measurement_id:
      type: text
      label: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_MEASUREMENT_ID
      help: PLUGIN_GOOSIALIZE_GOOGLE.TRACKING_MEASUREMENT_ID_HELP
      placeholder: G-XXXXXXXXXX
      validate:
        pattern: '^(G-[A-Za-z0-9]+)?$'

    search_console:
      type: section
      title: PLUGIN_GOOSIALIZE_GOOGLE.SEARCH_CONSOLE
      underline: true

    search_console.enabled:
      type: toggle
      label: PLUGIN_GOOSIALIZE_GOOGLE.SEARCH_CONSOLE_ENABLED
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    search_console.default_property:
      type: text
      label: PLUGIN_GOOSIALIZE_GOOGLE.SEARCH_CONSOLE_DEFAULT_PROPERTY
      help: PLUGIN_GOOSIALIZE_GOOGLE.SEARCH_CONSOLE_DEFAULT_PROPERTY_HELP
