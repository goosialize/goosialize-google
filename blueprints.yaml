name: Goosialize Google
slug: goosialize-google
type: plugin
version: 0.1.0
description: Google product integrations for Grav CMS, starting with Google Analytics 4 reporting.
icon: google

author:
  name: Goosialize Ltd
  email: dev@goosialize.com

homepage: https://goosialize.com

keywords:
  - grav
  - google
  - analytics
  - ga4
  - reporting

bugs: https://github.com/goosialize/goosialize-google/issues
license: MIT

dependencies:
  - { name: grav, version: '>=2.0.0' }

form:
  validation: strict

  fields:
    enabled:
      type: toggle
      label: PLUGIN_GOOSIALIZE_GOOGLE.ENABLED
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    authentication:
      type: section
      title: PLUGIN_GOOSIALIZE_GOOGLE.AUTHENTICATION
      underline: true

    authentication.default_connection:
      type: text
      label: PLUGIN_GOOSIALIZE_GOOGLE.DEFAULT_CONNECTION
      help: PLUGIN_GOOSIALIZE_GOOGLE.DEFAULT_CONNECTION_HELP

    authentication.service_account_file:
      type: text
      label: PLUGIN_GOOSIALIZE_GOOGLE.SERVICE_ACCOUNT_FILE
      help: PLUGIN_GOOSIALIZE_GOOGLE.SERVICE_ACCOUNT_FILE_HELP

    analytics:
      type: section
      title: PLUGIN_GOOSIALIZE_GOOGLE.ANALYTICS
      underline: true

    analytics.enabled:
      type: toggle
      label: PLUGIN_GOOSIALIZE_GOOGLE.ANALYTICS_ENABLED
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    analytics.default_property:
      type: text
      label: PLUGIN_GOOSIALIZE_GOOGLE.DEFAULT_PROPERTY
      help: PLUGIN_GOOSIALIZE_GOOGLE.DEFAULT_PROPERTY_HELP
      validate:
        pattern: '^[0-9]+$'

    search_console:
      type: section
      title: PLUGIN_GOOSIALIZE_GOOGLE.SEARCH_CONSOLE
      underline: true

    search_console.enabled:
      type: toggle
      label: PLUGIN_GOOSIALIZE_GOOGLE.SEARCH_CONSOLE_ENABLED
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    search_console.default_property:
      type: text
      label: PLUGIN_GOOSIALIZE_GOOGLE.SEARCH_CONSOLE_DEFAULT_PROPERTY
      help: PLUGIN_GOOSIALIZE_GOOGLE.SEARCH_CONSOLE_DEFAULT_PROPERTY_HELP
